name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: mlops_lab_g3
  AZ_REGISTRY: mlopslab3.azurecr.io
  AZURE_WEBAPP_NAME: mlopsg3lab

jobs:
  az-registry:
    name: Publish | Azure Container Registry
    runs-on: ubuntu-latest
    outputs:
      full_image: ${{ steps.image.outputs.full_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          echo "full_image=${{ env.AZ_REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZ_REGISTRY }}
          username: ${{ secrets.AZ_SP_CLIENT_ID }}
          password: ${{ secrets.AZ_SP_CLIENT_SECRET }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.image.outputs.full_image }}

  deploy:
    name: Azure Web App Deployment
    runs-on: ubuntu-latest
    needs: [az-registry]
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZ_SP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZ_SP_CLIENT_SECRET }}

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ needs.az-registry.outputs.full_image }}